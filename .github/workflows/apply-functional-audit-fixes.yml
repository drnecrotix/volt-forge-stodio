name: Apply functional audit fixes

on:
  push:
    branches:
      - feat/studio-full-functional-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: address Studio functional audit failures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-full-functional-audit
          fetch-depth: 0

      - name: Patch Studio core and shell
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          # Global Assets search instead of only searching the current category.
          path = Path('webapp/gui/studio-shell.js')
          text = path.read_text(encoding='utf-8')
          old = '''  function filterPalette() {
            if (!componentSearch || !palette) return;
            const query = componentSearch.value.trim().toLocaleLowerCase();
            palette.querySelectorAll(".palette-card").forEach((card) => {
              card.hidden = Boolean(query) && !card.textContent.toLocaleLowerCase().includes(query);
            });
          }
'''
          new = '''  function filterPalette() {
            if (!componentSearch || !palette) return;
            const query = componentSearch.value.trim().toLocaleLowerCase();

            // Search is global. The palette normally follows the component picker
            // category, so switch it to "All" once a search starts.
            if (query) {
              const allCategoryButton = document.querySelector("#componentCategoryMenu .picker-category-btn");
              if (allCategoryButton && !allCategoryButton.classList.contains("active")) {
                allCategoryButton.click();
                requestAnimationFrame(filterPalette);
                return;
              }
            }

            let matches = 0;
            palette.querySelectorAll(".palette-card").forEach((card) => {
              const hidden = Boolean(query) && !card.textContent.toLocaleLowerCase().includes(query);
              card.hidden = hidden;
              if (!hidden) matches += 1;
            });
            componentSearch.dataset.matches = String(matches);
          }
'''
          text = replace_once(text, old, new, 'global palette search')
          path.write_text(text, encoding='utf-8')

          # Native keyboard tools and manual-route Backspace behavior.
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = '''    if ((event.key === "Delete" || event.key === "Backspace") && !isTypingTarget()) {
              if (state.selectedWireId) {
                removeSelectedWire();
              } else {
                deleteSelectedComponent();
              }
            }
            if (event.key.toLowerCase() === "r" && !isTypingTarget()) {
              rotateSelected();
            }
            if (event.key.toLowerCase() === "w" && !isTypingTarget()) {
              setSelectedTool("wire");
            }
            if (event.key.toLowerCase() === "h" && !isTypingTarget()) {
              setSelectedTool("pan");
            }
'''
          new = '''    if (event.key === "Backspace" && !isTypingTarget() && state.selectedTool === "pencil" && state.pendingWire) {
              event.preventDefault();
              if (state.pendingWire.points.length) {
                state.pendingWire.points.pop();
              } else {
                clearPendingWire();
              }
              rerender();
              return;
            }
            if ((event.key === "Delete" || event.key === "Backspace") && !isTypingTarget()) {
              if (state.selectedWireId) {
                removeSelectedWire();
              } else {
                deleteSelectedComponent();
              }
            }
            if (event.key.toLowerCase() === "r" && !isTypingTarget()) {
              rotateSelected();
            }
            if (event.key.toLowerCase() === "v" && !isTypingTarget()) {
              setSelectedTool("select");
            }
            if (event.key.toLowerCase() === "w" && !isTypingTarget()) {
              setSelectedTool("wire");
            }
            if (event.key.toLowerCase() === "p" && !isTypingTarget()) {
              setSelectedTool("pencil");
            }
            if (event.key.toLowerCase() === "h" && !isTypingTarget()) {
              setSelectedTool("pan");
            }
'''
          text = replace_once(text, old, new, 'native tool shortcuts')

          # Empty canvas click cancels an unfinished auto-wire instead of unexpectedly panning.
          old = '''  const position = getMousePosition(event);

            if (terminal && ["wire", "pencil"].includes(state.selectedTool)) {
'''
          new = '''  const position = getMousePosition(event);

            if (!componentGroup && !terminal && !wireHit && state.selectedTool === "wire" && state.pendingWire) {
              clearPendingWire();
              rerender();
              return;
            }

            if (terminal && ["wire", "pencil"].includes(state.selectedTool)) {
'''
          text = replace_once(text, old, new, 'auto-wire cancel')

          # Analysis windows should always open. When transient data is invalid the
          # viewer itself shows an empty/error state instead of appearing broken.
          old = '''  if (!state.packages.transient?.success) {
              statusChip.textContent = state.packages.transient?.error || t("status.transientUnavailable");
              return;
            }
            waveformViewer.setResult(
'''
          new = '''  if (!state.packages.transient?.success) {
              statusChip.textContent = state.packages.transient?.error || t("status.transientUnavailable");
            }
            waveformViewer.setResult(
'''
          text = replace_once(text, old, new, 'waveforms open on unavailable transient')

          old = '''  if (!state.packages.transient?.success) {
              statusChip.textContent = state.packages.transient?.error || t("status.transientUnavailable");
              return;
            }
            frequencyViewer.setPayload({
'''
          new = '''  if (!state.packages.transient?.success) {
              statusChip.textContent = state.packages.transient?.error || t("status.transientUnavailable");
            }
            frequencyViewer.setPayload({
'''
          text = replace_once(text, old, new, 'frequency open on unavailable transient')
          path.write_text(text, encoding='utf-8')

          # Tool HUD updates synchronously after the native app handler.
          path = Path('webapp/gui/studio-enhancements.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''    button?.addEventListener("click", () => {
              requestAnimationFrame(refreshToolHelp);
              const meta = toolMeta[name];
              if (meta) setStatus(meta.label, "info");
            });
''', '''    button?.addEventListener("click", () => {
              refreshToolHelp();
              requestAnimationFrame(refreshToolHelp);
              const meta = toolMeta[name];
              if (meta) setStatus(meta.label, "info");
            });
''', 1)

          old = '''  document.addEventListener("keydown", (event) => {
            const target = event.target;
            const typing = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement || target?.isContentEditable;
            if (typing || event.ctrlKey || event.metaKey || event.altKey) return;

            const key = event.key.toLowerCase();
            const shortcuts = { v: "select", w: "wire", p: "pencil", h: "pan" };
            if (shortcuts[key] && toolButtons[shortcuts[key]]) {
              event.preventDefault();
              toolButtons[shortcuts[key]].click();
              return;
            }

            if (event.key === "Escape") {
              if (typeof window.clearPendingWire === "function") {
                window.clearPendingWire();
                if (typeof window.rerender === "function") window.rerender();
              }
              setStatus("Текущото действие е отменено", "info");
            }
          });
'''
          new = '''  window.addEventListener("keydown", (event) => {
            const target = event.target;
            const typing = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement || target?.isContentEditable;
            if (typing || event.ctrlKey || event.metaKey || event.altKey) return;

            const key = event.key.toLowerCase();
            const shortcuts = { v: "select", w: "wire", p: "pencil", h: "pan" };
            if (shortcuts[key]) {
              // app.js owns the actual tool state. It is registered on window first,
              // so only synchronize the Studio HUD here to avoid duplicate actions.
              requestAnimationFrame(() => {
                refreshToolHelp();
                const meta = toolMeta[shortcuts[key]];
                if (meta) setStatus(meta.label, "info");
              });
              return;
            }

            if (event.key === "Escape") {
              requestAnimationFrame(refreshToolHelp);
              setStatus("Текущото действие е отменено", "info");
            }
          });
'''
          text = replace_once(text, old, new, 'tool shortcut HUD synchronization')
          path.write_text(text, encoding='utf-8')

          # Fix the rotate test to re-query the rerendered SVG node.
          path = Path('scripts/studio-functional-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''      const selected=document.querySelector('#componentLayer .component.selected') || node;
              const before=selected.getAttribute('transform');
              document.querySelector('#rotateBtn')?.click();
              const after=selected.getAttribute('transform');
              return {selected:selected.classList.contains('selected'),before,after};
'''
          new = '''      const selected=document.querySelector('#componentLayer .component.selected') || node;
              const componentId=selected.dataset.componentId;
              const before=selected.getAttribute('transform');
              document.querySelector('#rotateBtn')?.click();
              const refreshed=document.querySelector(`#componentLayer .component[data-component-id="${componentId}"]`);
              const after=refreshed?.getAttribute('transform');
              return {selected:Boolean(refreshed?.classList.contains('selected')),before,after};
'''
          text = replace_once(text, old, new, 'rotate smoke test')
          path.write_text(text, encoding='utf-8')

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js webapp/gui/studio-shell.js webapp/gui/studio-enhancements.js scripts/studio-functional-smoke.mjs
          git commit -m "fix: address Studio functional audit failures"
          git push origin HEAD:feat/studio-full-functional-audit
