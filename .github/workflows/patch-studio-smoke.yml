name: Patch Studio smoke harness

on:
  push:
    branches:
      - feat/studio-full-functional-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: repair Studio functional audit harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-full-functional-audit
          fetch-depth: 0
      - name: Repair audit script
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/studio-functional-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('assert(info.titles.some((t)=>${titlePattern}.test(t)),', 'assert(info.titles.some((t)=>titlePattern.test(t)),')
          path.write_text(text, encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/studio-functional-smoke.mjs
          git commit -m "fix: repair Studio functional audit harness"
          git push origin HEAD:feat/studio-full-functional-audit
