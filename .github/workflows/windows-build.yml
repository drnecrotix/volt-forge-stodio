name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows Desktop Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect desktop build changes
        id: changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "build_required=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git fetch origin "${{ github.base_ref }}" --depth=1
          $changedFiles = git diff --name-only "origin/${{ github.base_ref }}...HEAD"
          $buildRequired = $false

          foreach ($file in $changedFiles) {
            if (
              $file -like "src/*" -or
              $file -eq "pyproject.toml" -or
              $file -eq ".github/workflows/windows-build.yml"
            ) {
              $buildRequired = $true
              break
            }
          }

          "build_required=$($buildRequired.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          if (-not $buildRequired) {
            Write-Host "No desktop build-impacting changes detected. Windows packaging will be skipped."
          }

      - name: Skip Windows build for non-desktop changes
        if: steps.changes.outputs.build_required != 'true'
        shell: pwsh
        run: Write-Host "Required Windows build check passed without packaging because this PR does not change the desktop application."

      - name: Set up Python
        if: steps.changes.outputs.build_required == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build tools
        if: steps.changes.outputs.build_required == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[plot]" pyinstaller
          python -m pip check

      - name: Run unit tests
        if: steps.changes.outputs.build_required == 'true'
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build desktop application
        if: steps.changes.outputs.build_required == 'true'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "VoltForge-Studio" `
            --collect-all PySide6 `
            --collect-all pyqtgraph `
            src/opencircuitlab/main.py

      - name: Create Windows archive
        if: steps.changes.outputs.build_required == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VoltForge-Studio/*" -DestinationPath "dist/VoltForge-Studio-Windows-x64.zip" -Force

      - name: Upload Windows build
        if: steps.changes.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoltForge-Studio-Windows-x64
          path: dist/VoltForge-Studio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
